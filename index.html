<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GL2Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/gl-theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="nav"></header>
  <main class="container">
    <div id="errors"></div>

    <section id="login-section" class="login-wrap hidden">
      <div class="card login-card">
        <span class="tag">GL2 · 2026</span>
        <h1>GL2<span class="accent">Stats</span><span class="cursor"></span></h1>
        <p>Type your last name to see where you stand. Your name is never stored.</p>
        <form id="login-form" autocomplete="off">
          <div class="form-group">
            <label for="lastname">Last name</label>
            <input id="lastname" name="lastname" type="text" placeholder="..." required autofocus>
          </div>
          <div class="form-group">
            <label for="pepper">Pepper</label>
            <input id="pepper" name="pepper" type="password" placeholder="Ask the class admin" required>
          </div>
          <div class="form-group hidden" id="prev-group">
            <label for="prev">Last year's average</label>
            <input id="prev" name="prev" type="text" inputmode="decimal" placeholder="e.g. 13.76">
          </div>
          <button class="btn" type="submit" id="login-btn">Show my stats</button>
          <div id="status" class="status"></div>
        </form>
      </div>
    </section>

    <section id="dashboard" class="page hidden">
      <div class="page-head">
        <h2>Your stats</h2>
        <p>Student <span class="mono accent" id="me-hash"></span></p>
      </div>
      <div class="stats-grid" id="me-stats"></div>
      <div class="actions">
        <a class="btn" href="ranking.html">See the ranking</a>
        <button class="btn btn-outline" type="button" id="my-marks">My marks</button>
        <a class="btn btn-outline" href="subjects.html">Statistics</a>
      </div>
      <p class="muted" id="formula-note"></p>
    </section>
  </main>

  <footer class="footer">GL2 2026/2027</footer>

  <script src="https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scrypt-js@3.0.1/scrypt.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/hash.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
